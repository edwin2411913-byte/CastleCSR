# ============================================================
# Server Configuration
# ============================================================
server.port=8080
server.servlet.context-path=/
spring.application.name=castlecsr-backend

# ============================================================
# Spring Profiles
# ============================================================
spring.profiles.active=local

# ============================================================
# Database Configuration
# ============================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver




# ============================================================
# JPA / Hibernate
# ============================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ============================================================
# Security hardening (Fase 5)
# ============================================================
# Rate limiting en /api/auth/login: intentos fallidos por IP dentro de la ventana
castlecsr.security.login.max-attempts=5
castlecsr.security.login.window-seconds=300
# Tamaño máximo de payload JSON aceptado en /api/** (bytes)
castlecsr.security.max-payload-bytes=65536

# ============================================================
# HTTP Compression (Gzip)ya
# ============================================================
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript
server.compression.min-response-size=1024

# ============================================================
# Logging
# ============================================================
logging.level.root=INFO
logging.level.com.castlecsr=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ============================================================
# Error Handling
# ============================================================
server.error.include-message=always
server.error.include-stacktrace=on-param
server.error.include-exception=false