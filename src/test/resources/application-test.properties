# ============================================================
# Test Profile - H2 en memoria
# ============================================================

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# JWT - secreto SOLO para tests (66 bytes en Base64, sin valor de seguridad)
jwt.secret=YWJjYWJjYWJjYWJjYWJjYWJjYWJjYWJjYWJjYWJjYWJjYWJjYWJjYWJjYWJjYWJjYWJjYWJjYWJjYWJjYWJjYWJj
jwt.expiration-ms=1800000
jwt.cookie-secure=false

# Rate limiting relajado: los tests de integración hacen varios logins fallidos
castlecsr.security.login.max-attempts=1000
castlecsr.security.login.window-seconds=300